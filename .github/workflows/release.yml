name: Release

# Every push to main builds Ether for every platform, installs it on each with install.sh and install.ps1, packs the npm
# package (@orbitmines/ether.ray) and installs that on each with npm; when the version in src/language.ts has no
# release yet, it publishes one (v<version>, the latest: the archives, their SHA256SUMS, both installers) and the npm
# package (with NPM_TOKEN, or as a trusted publisher when the NPM_TRUSTED_PUBLISHING variable is true), and the VS Code
# extension (Ether.ray, orbitmines.ether-ray, with the language bundled: its server, kernel and library under server/) to the Visual Studio Marketplace (VSCE_PAT, or Microsoft Entra ID when the
# AZURE_CLIENT_ID/AZURE_TENANT_ID variables are set) and to Open VSX (OVSX_PAT). Pull requests build and verify only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Version
        id: version
        run: |
          VERSION="$(./install.sh --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; building and verifying only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new."
          fi

      - name: Compile for every platform
        run: |
          ./install.sh --compile all --output dist
          cp install.sh install.ps1 dist/
          ls -la dist && cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: install.sh
        shell: bash
        run: |
          bash dist/install.sh --from dist
          export PATH="$HOME/.ether/bin:$PATH"
          for command in ether ray orbitmines; do echo "$command: $("$command" --version)"; done

      - name: The commands are on PATH in a new shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -lc 'ether --version && ray --version && orbitmines --version'
          if command -v zsh >/dev/null && [ -f "$HOME/.zshrc" ]; then zsh -ic 'ray --version'; fi

      - name: Uninstall (install.sh)
        shell: bash
        run: |
          bash dist/install.sh --uninstall
          test ! -e "$HOME/.ether/bin"
          ! grep -s "Ether installer" "$HOME/.profile" "$HOME/.bashrc" "$HOME/.zshrc"

      - name: install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          ./dist/install.ps1 -From dist
          $bin = Join-Path $HOME '.ether/bin'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          foreach ($command in 'ether', 'ray', 'orbitmines') { & (Join-Path $bin "$command$extension") --version; if ($LASTEXITCODE) { exit 1 } }
          ./dist/install.ps1 -Uninstall

      - name: install.ps1 (Windows PowerShell 5.1), then cmd finds the commands
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\dist\install.ps1 -From dist
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          cmd /c "ether --version && ray --version && orbitmines --version"
          if ($LASTEXITCODE) { exit 1 }
          .\dist\install.ps1 -Uninstall

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pack @orbitmines/ether.ray (its prepack, scripts/bundle.mjs, bundles src/language.ts and the .ray files)
        working-directory: "@ether/v0.ts"
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${{ needs.build.outputs.version }}"
          mkdir -p "$GITHUB_WORKSPACE/out" && npm pack --pack-destination "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: out/
          if-no-files-found: error

  verify-npm:
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: out
      - name: npm install -g, and each command knows its name
        shell: bash
        run: |
          npm install -g ./out/*.tgz
          for command in ether ray orbitmines; do
            echo "$command: $("$command" --version)"
            "$command" --help | grep -q "Usage: $command " || { echo "$command doesn't know it's $command"; exit 1; }
          done
      - name: The same from cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ray --help | findstr /C:"Usage: ray " || exit /b 1
          orbitmines --help | findstr /C:"Usage: orbitmines " || exit /b 1
      - name: The same from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($command in 'ether', 'ray', 'orbitmines') {
            if (-not (& $command --help | Select-String -SimpleMatch "Usage: $command ")) { throw "$command doesn't know it's $command" }
          }

  publish-npm:
    needs: [build, verify, verify-npm]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm new enough to publish as a trusted publisher (11.5.1 or later)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: out
      - name: publish to npm (@orbitmines/ether.ray), as a trusted publisher
        if: env.TRUSTED == 'true'
        run: if npm view "@orbitmines/ether.ray@$VERSION" version >/dev/null 2>&1; then echo "@orbitmines/ether.ray@$VERSION is on npm already"; else npm publish ./out/*.tgz --access public --provenance --tag latest; fi
      - name: publish to npm (@orbitmines/ether.ray), with a token
        if: env.TRUSTED != 'true' && env.HAS_TOKEN == 'true'
        run: if npm view "@orbitmines/ether.ray@$VERSION" version >/dev/null 2>&1; then echo "@orbitmines/ether.ray@$VERSION is on npm already"; else npm publish ./out/*.tgz --access public --provenance --tag latest; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: neither is set up
        if: env.TRUSTED != 'true' && env.HAS_TOKEN != 'true'
        run: echo "::warning::Not published to npm - set the NPM_TOKEN secret, or the NPM_TRUSTED_PUBLISHING variable once npm trusts this workflow."

  vscode:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install @orbitmines/ether.ray, which the extension bundles
        working-directory: "@ether/v0.ts"
        run: npm ci
      - name: package the extension (the Marketplace takes major.minor.patch only, so v0.1.3-E2027.0A.3 is 0.1.3)
        working-directory: "@ether/ide/vscode"
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${VERSION%%-*}"
          mkdir -p "$GITHUB_WORKSPACE/vsix"
          npx --yes @vscode/vsce package --no-dependencies --baseContentUrl https://github.com/orbitmines/ray/blob/main --baseImagesUrl https://raw.githubusercontent.com/orbitmines/ray/main --out "$GITHUB_WORKSPACE/vsix/ether-ray-${VERSION}.vsix"
      - name: the bundled language answers on its own through its own daemon (server/language.mjs --lsp with server/@ether, outside the repository)
        run: |
          probe="$RUNNER_TEMP/probe" && mkdir -p "$probe"
          cp -r "@ether/ide/vscode/server" "$probe/"
          node "@ether/ide/vscode/scripts/probe.mjs" "$probe"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vsix/
          if-no-files-found: error

  verify-vscode:
    needs: vscode
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: the .vsix installs into VS Code
        shell: bash
        run: |
          npm install --no-save @vscode/test-electron
          node -e "
            const {downloadAndUnzipVSCode, resolveCliArgsFromVSCodeExecutablePath} = require('@vscode/test-electron');
            const cp = require('child_process'); const fs = require('fs');
            (async () => {
              const exe = await downloadAndUnzipVSCode('stable');
              const [cli, ...args] = resolveCliArgsFromVSCodeExecutablePath(exe);
              const vsix = 'vsix/' + fs.readdirSync('vsix').find(f => f.endsWith('.vsix'));
              cp.execFileSync(cli, [...args, '--install-extension', vsix], {stdio: 'inherit', shell: process.platform === 'win32'});
              const listed = cp.execFileSync(cli, [...args, '--list-extensions'], {encoding: 'utf-8', shell: process.platform === 'win32'});
              if (!/orbitmines\.ether-ray/i.test(listed)) { console.error(listed); process.exit(1); }
            })().catch(e => { console.error(e); process.exit(1); });
          "

  publish-vscode:
    needs: [build, verify, vscode, verify-vscode]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_PAT: ${{ secrets.VSCE_PAT != '' }}
      ENTRA: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' }}
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
      PRE_RELEASE: ${{ vars.VSCE_PRE_RELEASE == 'true' && '--pre-release' || '' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: is this version on the Marketplace already
        id: listed
        run: |
          if npx --yes @vscode/vsce show orbitmines.ether-ray --json 2>/dev/null | grep -q "\"version\": *\"${VERSION%%-*}\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "orbitmines.ether-ray ${VERSION%%-*} is on the Marketplace already"
          else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - name: sign in to Azure (Microsoft Entra ID, no token kept in the repository)
        if: steps.listed.outputs.published != 'true' && env.ENTRA == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: publish to the Visual Studio Marketplace, through Entra ID
        if: steps.listed.outputs.published != 'true' && env.ENTRA == 'true'
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath vsix/*.vsix $PRE_RELEASE
      - name: publish to the Visual Studio Marketplace, with a token
        if: steps.listed.outputs.published != 'true' && env.ENTRA != 'true' && env.HAS_PAT == 'true'
        run: npx --yes @vscode/vsce publish --packagePath vsix/*.vsix $PRE_RELEASE
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: neither is set up
        if: env.ENTRA != 'true' && env.HAS_PAT != 'true'
        run: echo "::warning::Not published to the Visual Studio Marketplace - set the VSCE_PAT secret, or the AZURE_CLIENT_ID and AZURE_TENANT_ID variables."
      - name: publish to Open VSX (VSCodium, Cursor, Gitpod, …)
        if: env.HAS_OVSX == 'true'
        run: npx --yes ovsx publish vsix/*.vsix -p "$OVSX_PAT" $PRE_RELEASE || echo "::warning::Open VSX did not take this version (already published?)"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  release:
    needs: [build, verify, vscode]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Ether v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
