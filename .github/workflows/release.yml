name: Release

# Every push to main builds Ether for every platform, installs it on each with install.sh and install.ps1, and, when
# the version in kernel3/language.ts has no release yet, publishes one (v<version>, the latest) with the archives,
# their SHA256SUMS and both installers. Pull requests build and verify only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Version
        id: version
        run: |
          VERSION="$(./install.sh --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; building and verifying only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new."
          fi

      - name: Compile for every platform
        run: |
          ./install.sh --compile all --output dist
          cp install.sh install.ps1 dist/
          ls -la dist && cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: install.sh
        shell: bash
        run: |
          bash dist/install.sh --from dist
          export PATH="$HOME/.ether/bin:$PATH"
          for command in ether ray orbitmines; do echo "$command: $("$command" --version)"; done

      - name: The commands are on PATH in a new shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -lc 'ether --version && ray --version && orbitmines --version'
          if command -v zsh >/dev/null && [ -f "$HOME/.zshrc" ]; then zsh -ic 'ray --version'; fi

      - name: Uninstall (install.sh)
        shell: bash
        run: |
          bash dist/install.sh --uninstall
          test ! -e "$HOME/.ether/bin"
          ! grep -s "Ether installer" "$HOME/.profile" "$HOME/.bashrc" "$HOME/.zshrc"

      - name: install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          ./dist/install.ps1 -From dist
          $bin = Join-Path $HOME '.ether/bin'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          foreach ($command in 'ether', 'ray', 'orbitmines') { & (Join-Path $bin "$command$extension") --version; if ($LASTEXITCODE) { exit 1 } }
          ./dist/install.ps1 -Uninstall

      - name: install.ps1 (Windows PowerShell 5.1), then cmd finds the commands
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\dist\install.ps1 -From dist
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          cmd /c "ether --version && ray --version && orbitmines --version"
          if ($LASTEXITCODE) { exit 1 }
          .\dist\install.ps1 -Uninstall

  release:
    needs: [build, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Ether v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
