name: Release

# Every push to main builds Ether for every platform, installs it on each with install.sh and install.ps1, packs the npm
# package (@orbitmines/ether.ray) and installs that on each with npm; when the version in kernel3/language.ts has no
# release yet, it publishes one (v<version>, the latest: the archives, their SHA256SUMS, both installers) and the npm
# package (with NPM_TOKEN, or as a trusted publisher when the NPM_TRUSTED_PUBLISHING variable is true). Pull requests
# build and verify only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Version
        id: version
        run: |
          VERSION="$(./install.sh --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; building and verifying only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new."
          fi

      - name: Compile for every platform
        run: |
          ./install.sh --compile all --output dist
          cp install.sh install.ps1 dist/
          ls -la dist && cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: install.sh
        shell: bash
        run: |
          bash dist/install.sh --from dist
          export PATH="$HOME/.ether/bin:$PATH"
          for command in ether ray orbitmines; do echo "$command: $("$command" --version)"; done

      - name: The commands are on PATH in a new shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -lc 'ether --version && ray --version && orbitmines --version'
          if command -v zsh >/dev/null && [ -f "$HOME/.zshrc" ]; then zsh -ic 'ray --version'; fi

      - name: Uninstall (install.sh)
        shell: bash
        run: |
          bash dist/install.sh --uninstall
          test ! -e "$HOME/.ether/bin"
          ! grep -s "Ether installer" "$HOME/.profile" "$HOME/.bashrc" "$HOME/.zshrc"

      - name: install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          ./dist/install.ps1 -From dist
          $bin = Join-Path $HOME '.ether/bin'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          foreach ($command in 'ether', 'ray', 'orbitmines') { & (Join-Path $bin "$command$extension") --version; if ($LASTEXITCODE) { exit 1 } }
          ./dist/install.ps1 -Uninstall

      - name: install.ps1 (Windows PowerShell 5.1), then cmd finds the commands
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\dist\install.ps1 -From dist
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          cmd /c "ether --version && ray --version && orbitmines --version"
          if ($LASTEXITCODE) { exit 1 }
          .\dist\install.ps1 -Uninstall

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pack @orbitmines/ether.ray (its prepack, scripts/bundle.mjs, bundles kernel3/language.ts and the .ray files)
        working-directory: "@ether/$/.ray/v0.ts"
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${{ needs.build.outputs.version }}"
          mkdir -p "$GITHUB_WORKSPACE/out" && npm pack --pack-destination "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: out/
          if-no-files-found: error

  verify-npm:
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: out
      - name: npm install -g, and each command knows its name
        shell: bash
        run: |
          npm install -g ./out/*.tgz
          for command in ether ray orbitmines; do
            echo "$command: $("$command" --version)"
            "$command" --help | grep -q "Usage: $command " || { echo "$command doesn't know it's $command"; exit 1; }
          done
      - name: The same from cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ray --help | findstr /C:"Usage: ray " || exit /b 1
          orbitmines --help | findstr /C:"Usage: orbitmines " || exit /b 1
      - name: The same from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($command in 'ether', 'ray', 'orbitmines') {
            if (-not (& $command --help | Select-String -SimpleMatch "Usage: $command ")) { throw "$command doesn't know it's $command" }
          }

  publish-npm:
    needs: [build, verify, verify-npm]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm new enough to publish as a trusted publisher (11.5.1 or later)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: out
      - name: publish to npm (@orbitmines/ether.ray), as a trusted publisher
        if: env.TRUSTED == 'true'
        run: if npm view "@orbitmines/ether.ray@$VERSION" version >/dev/null 2>&1; then echo "@orbitmines/ether.ray@$VERSION is on npm already"; else npm publish ./out/*.tgz --access public --provenance --tag latest; fi
      - name: publish to npm (@orbitmines/ether.ray), with a token
        if: env.TRUSTED != 'true' && env.HAS_TOKEN == 'true'
        run: if npm view "@orbitmines/ether.ray@$VERSION" version >/dev/null 2>&1; then echo "@orbitmines/ether.ray@$VERSION is on npm already"; else npm publish ./out/*.tgz --access public --provenance --tag latest; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: neither is set up
        if: env.TRUSTED != 'true' && env.HAS_TOKEN != 'true'
        run: echo "::warning::Not published to npm - set the NPM_TOKEN secret, or the NPM_TRUSTED_PUBLISHING variable once npm trusts this workflow."

  release:
    needs: [build, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Ether v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
