name: score

on:
  push:
    branches: [main]
    paths:
      - '@ether/**/*.ray'
      - '@ether/v0.ts/src/**'
      - '@ether/v0.ts/scripts/**'
      - '@ether/v0.ts/bin/**'
      - '@ether/v0.ts/tsconfig.json'
      - '@ether/v0.ts/package.json'
      - '@ether/v0.ts/package-lock.json'
      - '@ether/v0.ts/score.json'
      - '.github/workflows/score.yml'
  pull_request:
    paths:
      - '@ether/**/*.ray'
      - '@ether/v0.ts/src/**'
      - '@ether/v0.ts/scripts/**'
      - '@ether/v0.ts/bin/**'
      - '@ether/v0.ts/tsconfig.json'
      - '@ether/v0.ts/package.json'
      - '@ether/v0.ts/package-lock.json'
      - '@ether/v0.ts/score.json'
      - '.github/workflows/score.yml'
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "@ether/v0.ts"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Ratchet against score.json
        run: node scripts/score.mjs --check --jobs 2 --out score.current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-${{ github.sha }}
          path: "@ether/v0.ts/score.current.json"
